[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "draw-telephone"
version = "0.1.0"
description = "画意接龙 - 异步绘画接力游戏"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "loguru>=0.7.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

# 代码质量工具链：范围收敛到 backend/src + backend/tests
# pycore/ 是后端框架依赖，不纳入项目质量门禁
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["pycore", "frontend", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

# FastAPI Depends()/Query()/Header() 作为参数默认值是标准模式，B008 误报
[tool.ruff.lint.per-file-ignores]
"backend/src/api/**/*.py" = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
exclude = "(pycore|frontend|\\.venv)/"

# pycore 是后端框架依赖，不纳入项目质量门禁
# 跟踪导入时跳过 pycore，避免框架内部无类型注解报错
[[tool.mypy.overrides]]
module = ["pycore.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
