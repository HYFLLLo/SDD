<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>画意接龙 · 创建链</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .form-card{max-width:560px;margin:0 auto;padding:32px}
  .form-card h1{font-size:24px;margin-bottom:6px}
  .form-card .desc{color:var(--text2);margin-bottom:28px}
  .seg{display:flex;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-btn);padding:3px;margin-bottom:10px}
  .seg button{flex:1;padding:8px;border-radius:6px;font-weight:700;font-size:13px;color:var(--text2)}
  .seg button.active{background:var(--paper);color:var(--accent);box-shadow:var(--shadow)}
  .slider-row{display:flex;align-items:center;gap:16px}
  .slider-row input[type=range]{flex:1;accent-color:var(--accent)}
  .slider-val{font-size:20px;font-weight:800;color:var(--accent);min-width:40px;text-align:center}
  .prompt-preview{background:var(--canvas);border:1.5px dashed var(--dash);border-radius:var(--r-canvas);padding:20px;text-align:center;margin-top:10px}
  .prompt-preview .word{font-size:28px;color:var(--text)}
  .prompt-preview .sub{font-size:12px;color:var(--text3);margin-top:6px}
  .gen-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="mark"></span>画意接龙</div>
  <nav class="nav-center"><a href="01-plaza.html">广场</a><a href="08-profile.html">我的</a></nav>
  <div class="nav-right">
    <button class="bell"><span>🔔</span></button>
    <a href="08-profile.html" class="avatar">小</a>
  </div>
</div>

<div class="container narrow">
  <div class="card form-card">
    <h1>创建一条链</h1>
    <div class="desc">设定链长和起手题，邀请朋友来接力</div>

    <!-- 链长 -->
    <div class="field">
      <label>链长（画-述交替，起手为画）</label>
      <div class="slider-row">
        <input type="range" min="4" max="10" value="6">
        <span class="slider-val">6</span>
      </div>
      <div class="hint">4-10 节点，默认 6。第 1 节点为画，之后画-述交替。</div>
    </div>

    <!-- 标题 -->
    <div class="field">
      <label>标题（可选）</label>
      <input class="input" placeholder="给这条链起个名字">
    </div>

    <!-- 公开性 -->
    <div class="field">
      <label>公开性</label>
      <div class="seg">
        <button class="active">邀请制</button>
        <button>公开广场</button>
      </div>
      <div class="hint">邀请制：仅房间码可加入。公开广场：完成后可在广场浏览。</div>
    </div>

    <!-- 起手题来源 -->
    <div class="field">
      <label>起手题来源</label>
      <div class="seg">
        <button>自己写题</button>
        <button class="active">AI 生成</button>
      </div>
      <div class="prompt-preview">
        <div class="word handwritten">「戴帽子的猫」</div>
        <div class="sub">AI 生成 · 具象但开放，易被误读</div>
      </div>
      <span class="gen-btn">↻ 换一个</span>
    </div>

    <!-- 提交 -->
    <button class="btn btn-primary btn-lg" style="width:100%;margin-top:8px" onclick="location.href='04-room.html'">创建并生成房间码</button>
  </div>
</div>

<div class="proto-note">原型展示用 · 真实交互：POST /api/chains 创建链；AI 起手题调用 DeepSeek；生成 6 位房间码</div>
</body>
</html>
